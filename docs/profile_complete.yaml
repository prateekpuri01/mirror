    title: "Assessing the Landscape of Advanced Technologies for Department of the Air Force Training and Education"
    date_range: "2023-2024"
    impact_summary: |
      Tech lead on NLP pipeline for a RAND Project AIR FORCE assessment of advanced training
      technologies. Built a multi-stage text classification system to categorize ~300K documents
      (spanning DAF, DoD, commercial, academic, allied, and adversary sources from 1990-2022)
