[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "alembic/versions",
    "__pycache__",
    "scripts/eval",  # dev eval scripts — separate quality bar
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (fine for FastAPI Depends)

    # TODO(post-launch): fix and re-enable. Suppressed for the v0 public
    # release — these are latent issues from before open-sourcing, not
    # regressions from it.
    "B904",  # raise without `from` (error chaining)
    "E741",  # ambiguous variable names (single letters like `l`, `I`, `O`)
    "E402",  # module-level import not at top of file
    "B023",  # function uses loop variable
    "F402",  # import shadows previous binding
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "F821"]  # unused imports + forward-ref strings ok in tests
# SQLAlchemy ``Mapped["Job"]`` forward-reference strings trip F821 as false positives
"app/models/*" = ["F821"]
"app/services/hot_search/evaluation.py" = ["F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
