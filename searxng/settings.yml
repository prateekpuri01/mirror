use_default_settings: true

general:
  instance_name: "Job Board Search"

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "jobboard-searxng-secret"
  bind_address: "0.0.0.0"
  port: 8080

outgoing:
  verify: false

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: w
    disabled: false
